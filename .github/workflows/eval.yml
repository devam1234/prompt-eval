name: prompt-eval
on:
  pull_request:
    paths: ["prompts/**", "data/**", "evalkit/**", "config.json"]
jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pytest
      - run: pytest -q
      # Deterministic, no API key needed. Exit code 1 (DO NOT SHIP) fails the check and blocks the merge.
      - run: python -m evalkit.run --data data/questions.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: eval-report, path: results/ }
